name: Build & Release devideo (.exe & .dmg + Cloudflare R2 Auto-Upload)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform }} (${{ matrix.target }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            artifact_name: 'devideo-macOS-AppleSilicon-DMG'
            artifact_path: 'src-tauri/target/**/bundle/dmg/*.dmg'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            artifact_name: 'devideo-Windows-x64-Setup-EXE'
            artifact_path: 'src-tauri/target/**/bundle/nsis/*.exe'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: |
          bun install
          cd engine && bun install
          cd ../ui && bun install

      - name: Compile Standalone Engine (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          cd engine
          bun build src/server-entry.ts --compile --external chromium-bidi --outfile ../src-tauri/binaries/engine-aarch64-apple-darwin
          cp ../src-tauri/binaries/engine-aarch64-apple-darwin ../src-tauri/binaries/engine

      - name: Compile Standalone Engine (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          cd engine
          bun build src/server-entry.ts --compile --external chromium-bidi --outfile ../src-tauri/binaries/engine-x86_64-pc-windows-msvc.exe
          cp ../src-tauri/binaries/engine-x86_64-pc-windows-msvc.exe ../src-tauri/binaries/engine.exe

      - name: Build Application with Tauri CLI (.exe / .dmg & Updater)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          tagName: v__VERSION__
          releaseName: 'devideo v__VERSION__'
          releaseBody: 'Official release build for macOS (.dmg) and Windows (.exe).'
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Save Artifacts for Direct GitHub Actions Download
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: warn

      - name: Upload Binaries & Updater to Cloudflare R2
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 'ae4a8362e4ec59075817f1e22baf4f3d'
        shell: bash
        run: |
          bun add -g wrangler
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          DMG_NAME="devideo_${VERSION}_aarch64.dmg"
          EXE_NAME="devideo_${VERSION}_x64-setup.exe"

          # Upload macOS DMG & Windows Setup to R2 (remote)
          find src-tauri/target -name "*.dmg" | while read f; do
            bunx wrangler r2 object put "devideo-releases/${DMG_NAME}" --file="$f" --remote
          done
          find src-tauri/target -name "*setup*.exe" | while read f; do
            bunx wrangler r2 object put "devideo-releases/${EXE_NAME}" --file="$f" --remote
          done

          # Upload Tauri Updater archives & signatures to R2 (remote)
          for pattern in "*.tar.gz" "*.tar.gz.sig" "*.nsis.zip" "*.nsis.zip.sig"; do
            find src-tauri/target -name "$pattern" | while read f; do
              KEY=$(basename "$f")
              bunx wrangler r2 object put "devideo-releases/${KEY}" --file="$f" --remote
            done
          done

          # Enrich latest.json with release_downloads for /release page, then upload
          LATEST_JSON=$(find src-tauri/target -name "latest.json" -print -quit)
          if [ -n "$LATEST_JSON" ]; then
            DMG_SIZE=0
            EXE_SIZE=0
            DMG_FILE=$(find src-tauri/target -name "*.dmg" -print -quit)
            EXE_FILE=$(find src-tauri/target -name "*setup*.exe" -print -quit)
            if [ -n "$DMG_FILE" ]; then
              DMG_SIZE=$(stat -f%z "$DMG_FILE" 2>/dev/null || stat -c%s "$DMG_FILE" 2>/dev/null || echo 0)
            fi
            if [ -n "$EXE_FILE" ]; then
              EXE_SIZE=$(stat -f%z "$EXE_FILE" 2>/dev/null || stat -c%s "$EXE_FILE" 2>/dev/null || echo 0)
            fi
            DMG_MB=$(echo "scale=1; ${DMG_SIZE} / 1048576" | bc 2>/dev/null || echo "0")
            EXE_MB=$(echo "scale=1; ${EXE_SIZE} / 1048576" | bc 2>/dev/null || echo "0")
            jq --arg dmg "$DMG_NAME" --arg dmgs "${DMG_MB} MB" \
               --arg exe "$EXE_NAME" --arg exes "${EXE_MB} MB" \
               '. + {release_downloads: {macos_dmg: {filename: $dmg, size: $dmgs}, windows_exe: {filename: $exe, size: $exes}}}' \
               "$LATEST_JSON" > /tmp/latest-enriched.json
            bunx wrangler r2 object put devideo-releases/latest.json --file=/tmp/latest-enriched.json --remote
          else
            echo "⚠️ No latest.json found from Tauri build — updater signature may be missing"
          fi
