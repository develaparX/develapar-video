name: Build & Release devideo (.exe & .dmg + Cloudflare R2 Auto-Upload)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform }} (${{ matrix.target }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            artifact_name: 'devideo-macOS-AppleSilicon-DMG'
            artifact_path: 'src-tauri/target/**/bundle/dmg/*.dmg'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            artifact_name: 'devideo-Windows-x64-Setup-EXE'
            artifact_path: 'src-tauri/target/**/bundle/nsis/*.exe'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: |
          bun install
          cd engine && bun install
          cd ../ui && bun install

      - name: Compile Standalone Engine (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          cd engine
          bun build src/server-entry.ts --compile --external chromium-bidi --outfile ../src-tauri/binaries/engine-aarch64-apple-darwin
          cp ../src-tauri/binaries/engine-aarch64-apple-darwin ../src-tauri/binaries/engine

      - name: Compile Standalone Engine (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          cd engine
          bun build src/server-entry.ts --compile --target=bun-windows-x64-baseline --external chromium-bidi --outfile ../src-tauri/binaries/engine-x86_64-pc-windows-msvc.exe
          cp ../src-tauri/binaries/engine-x86_64-pc-windows-msvc.exe ../src-tauri/binaries/engine.exe

      - name: Normalize & Verify Tauri Signing Key
        shell: bash
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RAW_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          bun ./scripts/prepare-signing-key.mjs

      - name: Build Application with Tauri CLI (.exe / .dmg & Updater)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'devideo v__VERSION__'
          releaseBody: 'Official release build for macOS (.dmg) and Windows (.exe).'
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Save Artifacts for Direct GitHub Actions Download
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: warn

      - name: Upload Binaries & Updater to Cloudflare R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 'ae4a8362e4ec59075817f1e22baf4f3d'
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "⚠️ CLOUDFLARE_API_TOKEN is not set, skipping R2 upload"
            exit 0
          fi
          bun add -g wrangler
          VERSION=$(bun -e 'console.log(JSON.parse(require("fs").readFileSync("src-tauri/tauri.conf.json","utf8")).version)')
          DMG_NAME="devideo_${VERSION}_aarch64.dmg"
          EXE_NAME="devideo_${VERSION}_x64-setup.exe"

          # Upload macOS DMG & Windows Setup to R2 (remote)
          find src-tauri/target -name "*.dmg" | while read f; do
            bunx wrangler r2 object put "devideo-releases/${DMG_NAME}" --file="$f" --remote
          done
          find src-tauri/target -name "*setup*.exe" | while read f; do
            bunx wrangler r2 object put "devideo-releases/${EXE_NAME}" --file="$f" --remote
          done

          # Upload Tauri Updater archives & signatures to R2 (remote)
          for pattern in "*.tar.gz" "*.tar.gz.sig" "*.nsis.zip" "*.nsis.zip.sig" "*setup*.exe.sig"; do
            find src-tauri/target -name "$pattern" | while read f; do
              KEY=$(basename "$f")
              bunx wrangler r2 object put "devideo-releases/${KEY}" --file="$f" --remote
            done
          done

          # Fetch existing latest.json so macOS & Windows jobs merge their platform entries cleanly
          curl -fsSL "https://devideo-api.develapar.com/api/auth/update/latest.json" -o existing-latest.json || true

          # Generate and upload latest.json for /release page & in-app auto-updater
          bun ./scripts/generate-latest-json.mjs
          bunx wrangler r2 object put devideo-releases/latest.json --file=latest-enriched.json --remote
